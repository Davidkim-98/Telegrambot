name: Bursa Stock Monitor

# 触发条件
on:
  schedule:
    # 每天大马时间 18:15 自动运行 (对应 UTC 10:15)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # 允许你手动点击按钮随时测试运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance requests pandas pandas_ta

      - name: Run bot
        env:
          # 这里会引用你在 Settings -> Secrets 里设置的变量
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
