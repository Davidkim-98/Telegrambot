name: Bursa Stock Monitor

on:
  schedule:
    # 大马时间中午 12:00 运行 (对应 UTC 04:00)
    - cron: '0 4 * * 1-5'
  workflow_dispatch: 

# 必须增加写入权限，否则脚本无法保存历史记录文件
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance requests pandas pandas-ta-classic

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push history
        # 这一步负责把记录了消息 ID 的 history.json 保存回你的仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "Update message history [skip ci]" || true
          git push || true

      - name: Run Crypto and REIT Monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_monitor.py
